<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost and Found</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Lost Item - College Portal</h1>
    </header>

    <section class="form-section">
           <h2>Report a Lost Item</h2>
        <form id="lostFoundForm">
            <label for="name">Your Name:</label>
            <input type="text" id="name" required>

            <label for="contact">Contact Info:</label>
            <input type="text" id="contact" required>

            <label for="item">Item Name:</label>
            <input type="text" id="item" required>

            <label for="location">Last Seen Location:</label>
            <input type="text" id="location" required>

            <label for="Description Name">Description:</label>
            <input type="text" id="description name" required>

            <label for="type">Item Status:</label>
            <select id="type" required>
                <option value="lost">Lost</option>
                <option value="found">Found</option>
            </select>
            <button type="submit">Submit</button>
        </form>
    </section>

    <section class="list-section">
       
    </section>

</body>
</html>
